name: Build & Update Staging GitOps Config

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/branch_promotion_app:${{ github.sha }}

  update-infra:
    name: Update GitOps Repo Manifests
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Infra Repo
        uses: actions/checkout@v4
        with:
          repository: 'wafiqpuyol/Branch-Promotion-Project-config'
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          ref: 'master'
          persist-credentials: true

      - name: Update Image Tag in Staging Overlay
        run: |
          sed -i "s|image: ${{ secrets.DOCKERHUB_USERNAME }}/branch_promotion_app:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/branch_promotion_app:${{ github.sha }}|" \
             overlays/staging/deployment-patches.yml

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          BRANCH="promote/dev-to-staging-${{ github.sha }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/branch_promotion_app:${{ github.sha }}"
          TAG="${{ github.sha }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add overlays/staging/deployment-patches.yml
          git commit -m "chore: promote staging image ${TAG} to production"
          git push -u origin "$BRANCH"

          PR_BODY=$(cat <<EOF
          ## Automated Production Promotion Request

          This pull request promotes the current **staging** image to **production**.

          | Field | Value |
          | --- | --- |
          | Image | \`${IMAGE}\` |
          | Tag | \`${TAG}\` |
          | Target | \`overlays/staging/deployment-patches.yml\` |
          | Triggered by | @${{ github.actor }} |
          | Workflow | Promote Dev to Staging |

          ### Notes
          - Review the staging environment before merging.
          - Merging this PR will update the staging overlay image tag.
          EOF
          )

          # Strip common leading indentation from the heredoc body
          PR_BODY=$(echo "$PR_BODY" | sed 's/^          //')

          gh pr create \
            --repo wafiqpuyol/Branch-Promotion-Project-config \
            --base master \
            --head "$BRANCH" \
            --title "Automated Staging Promotion Request: ${TAG}" \
            --body "$PR_BODY"