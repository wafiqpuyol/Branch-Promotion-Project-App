name: Build & Update Staging GitOps Config

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/branch_promotion_app:${{ github.sha }}

  update-infra:
    name: Update GitOps Repo Manifests
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Infra Repo
        uses: actions/checkout@v4
        with:
          repository: 'wafiqpuyol/Branch-Promotion-Project-config'
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          ref: 'main'

      - name: Update Image Tag in Staging Overlay
        run: |
          sed -i "s|image: .*/${{ secrets.DOCKERHUB_USERNAME }}:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/Branch-Promotion-Project-config:${{ github.sha }}|" \
            overlays/staging/deployment-patches.yaml

      - name: Commit and Push Changes to Infra Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git diff-index --quiet HEAD; then
            git add overlays/staging/deployment-patches.yaml
            git commit -m "chore(staging): update image to ${{ github.sha }} [skip ci]"
            git push origin main
          else
            echo "No changes detected in manifest. Skipping commit."
          fi